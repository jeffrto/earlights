[project]
name = "earlights"
version = "0.1.0"
description = "Turn Audible bookmarks into text highlights"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["audible", "audiobook", "bookmarks", "highlights", "readwise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "httpx>=0.27",
    "lxml>=5.0",
    "platformdirs>=4.0",
    "rapidfuzz>=3.0",
]

[project.urls]
Homepage = "https://github.com/jeffrto/earlights"
Issues = "https://github.com/jeffrto/earlights/issues"

[project.scripts]
earlights = "earlights.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earlights"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
